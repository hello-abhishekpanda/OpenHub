services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openhub
      POSTGRES_USER: openhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openhub-dev}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack-server:7.4.0-v3
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
