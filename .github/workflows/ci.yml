name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore OpenHub.sln
      - run: dotnet build OpenHub.sln --configuration Release --no-restore
      - run: dotnet test OpenHub.sln --configuration Release --no-build
